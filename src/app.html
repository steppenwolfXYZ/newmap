<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.ico" sizes="32x32" />
		<link rel="icon" href="%sveltekit.assets%/icon.svg" type="image/svg+xml" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.json" />
		<meta name="theme-color" content="#740013" />
		<title>Kora Maps</title>
		<meta name="description" content="A public-transit-first map: every train, tram and bus line drawn by how often it runs — plus walkable streets, paths and places." />
		<meta property="og:title" content="Kora Maps" />
		<meta property="og:description" content="A public-transit-first map — lines drawn by frequency and speed, walkability built in." />
		<meta property="og:type" content="website" />
		<meta property="og:url" content="https://koramaps.app" />
		<meta property="og:image" content="https://koramaps.app/icon-512.png" />
		<meta name="twitter:card" content="summary" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<!-- Self-hosted fonts (no Google CDN). Saira is the variable font
		     (weights 100-900 in one file, split by unicode-range); the icon
		     font is subsetted to the six mode icons StopSearch uses. -->
		<link rel="preload" href="%sveltekit.assets%/fonts/saira-vf-latin.woff2" as="font" type="font/woff2" crossorigin />
		<style>
			@font-face {
				font-family: 'Saira';
				font-style: normal;
				font-weight: 100 900;
				font-stretch: 100%;
				font-display: swap;
				src: url('%sveltekit.assets%/fonts/saira-vf-latin.woff2') format('woff2');
				unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
			}
			@font-face {
				font-family: 'Saira';
				font-style: normal;
				font-weight: 100 900;
				font-stretch: 100%;
				font-display: swap;
				src: url('%sveltekit.assets%/fonts/saira-vf-latin-ext.woff2') format('woff2');
				unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
			}
			@font-face {
				/* Material Symbols subset — regeneration process in
				   .claude/rules/deployment.md § UI fonts. Filled icons
				   are the app-wide default (`.material-symbols-outlined`
				   sets `font-variation-settings: 'FILL' 1` below); do
				   not opt back into the outline style — see
				   .claude/rules/project.md § UI icons. Icons in use
				   (sorted, keep alphabetical for the download URL):
			   arrow_downward, arrow_upward, assist_walker, balance,
			   chevron_right, crown, delete, directions,
			   directions_bike, directions_boat, directions_boat_filled,
			   directions_bus, directions_bus_filled, directions_car,
			   directions_run, directions_transit,
			   directions_transit_filled, directions_walk, edit, flight,
			   gondola_lift, home_work, hourglass_top, info,
			   local_fire_department, location_on, map,
			   my_location, nature_people, navigate_next, place,
			   play_arrow, refresh, room, share, shield, snail,
			   sports_score, sprint, subway, swap_vert, thumb_down,
			   thumb_down_off_alt, thumb_up, thumb_up_off_alt,
			   time_to_leave, train, tram, transfer_within_a_station,
			   trip_origin, tune */
				font-family: 'Material Symbols Outlined';
				font-style: normal;
				font-weight: 400;
				font-display: block;
				src: url('%sveltekit.assets%/fonts/material-symbols-subset.woff2') format('woff2');
			}
			.material-symbols-outlined {
				font-family: 'Material Symbols Outlined';
				font-weight: normal;
				font-style: normal;
				font-size: 24px;
				line-height: 1;
				letter-spacing: normal;
				text-transform: none;
				display: inline-block;
				white-space: nowrap;
				word-wrap: normal;
				direction: ltr;
				font-variation-settings: 'FILL' 1;
				-webkit-font-feature-settings: 'liga';
				-webkit-font-smoothing: antialiased;
			}
		</style>
		<style>
			/* Splash screen shown while the map loads and geolocation
			   resolves. Hidden by Map.svelte on the map's `load` event.
			   Inline so it paints on the very first frame, before any
			   external CSS/JS finishes loading. */
			#kora-splash {
				position: fixed;
				inset: 0;
				z-index: 9999;
				/* Brand gradient — keep in sync with --kora-green /
				   --kora-brown in variables.css (inlined here because the
				   splash paints before that stylesheet loads). */
				background: linear-gradient(135deg, #a0c8a0 0%, #c4a078 100%);
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				gap: 24px;
				transition: opacity 400ms ease-out;
				pointer-events: none;
			}
			#kora-splash.kora-splash-hidden { opacity: 0; }
			#kora-splash img {
				width: min(60vmin, 320px);
				height: auto;
				filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.12));
			}
			#kora-splash-status {
				font-family: 'Saira', sans-serif;
				font-size: 15px;
				color: rgba(40, 34, 26, 0.75);
				letter-spacing: 0.03em;
			}
		</style>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div id="kora-splash">
			<img src="%sveltekit.assets%/logo.svg" alt="Kora Maps" />
			<div id="kora-splash-status">loading map...</div>
		</div>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
