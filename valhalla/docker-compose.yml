# Local Valhalla pedestrian router (Switzerland + neighbours).
#
# Valhalla is the sole walking authority (see
# .claude/concepts/valhalla-pedestrian-router.md). It powers:
#   - direct walk-only itineraries surfaced to the user
#   - pre/post-transit walk legs shown in transit results
#   - the stop-to-stop footpath matrix that seeds MOTIS's RAPTOR
#     transfer table (see scripts/routing/build_valhalla_footpath_matrix.py
#     and the MOTIS fork's `footpath_matrix` config key)
#
# The gis-ops docker-valhalla image bootstraps everything:
#   - on first `up` with only the PBF present it downloads SRTM
#     1-arcsec elevation for the PBF's bbox, builds admin polygons,
#     then builds the routing tiles under ./data/valhalla_tiles/
#   - on later `up` calls with unchanged inputs it skips straight to
#     serving on :8002
#
# The same MOTIS-preprocessed PBF is reused so alp / forest roads
# route for pedestrians on both engines (see
# scripts/routing/preprocess_osm_for_motis.py).
services:
  valhalla:
    # The Kora fork of Valhalla (valhalla/fork/): upstream pinned at
    # VALHALLA_REF in valhalla/fork/Dockerfile plus the Kora bicycle
    # costing (.claude/concepts/bicycle-costing-fork.md). Locally built,
    # no registry — scripts/routing/setup_routing.sh step 2 builds it. It is a
    # drop-in for ghcr.io/valhalla/valhalla-scripted:<VALHALLA_REF>: same
    # entrypoint, same environment interface below, same tiles. Costing is
    # query-time, so a costing change is image rebuild + restart, never a
    # tile rebuild.
    #
    # History: the old ghcr.io/gis-ops/docker-valhalla image was archived
    # in March 2026 and its `latest` tag had stopped moving in October 2024
    # — it reported Valhalla 3.5.1 while missing the level/elevator support
    # 3.5.x actually shipped, so `elevator_penalty`, `step_penalty`,
    # `search_filter.level` and the wheelchair profile were all silently
    # inert: a lift was a free teleport between levels. Hence the pin.
    #
    # The upstream version is PINNED on purpose (in the fork's Dockerfile,
    # not here): `latest` is what let a two-year-old router sit unnoticed.
    # Bumping it is a deliberate act — it forces a tile rebuild and,
    # because the transfer table is derived from the graph, a
    # footpath-matrix rebuild too. setup_routing.sh keys its tile-staleness
    # check on that pin (valhalla/data/.tiles_valhalla_version), so a fork
    # iteration that only changes costing leaves the tiles alone.
    image: koramaps/valhalla:bicycle-costing
    container_name: kora-valhalla
    ports:
      - "8002:8002"
    volumes:
      - ./data:/custom_files
      # Mount the pipeline-bboxed multi-country PBF with foot=yes
      # patches (see scripts/routing/preprocess_osm_for_motis.py --valhalla).
      # CH-only would leave every cross-border GTFS stop (Basel Bad,
      # Konstanz, Domodossola, Weil am Rhein, …) unroutable, poisoning
      # the transfer matrix. The wider bbox covers CH + DE + FR + IT +
      # AT + LI within the pipeline's routing area.
      - ../data/osm/ch_pfaedle_walkable.osm.pbf:/custom_files/ch_pfaedle_walkable.osm.pbf:ro
      # pam limits override — see nofile.conf for why --ulimit alone is
      # not enough in this image.
      - ./nofile.conf:/etc/security/limits.d/99-nofile.conf:ro
    environment:
      # tile_urls is empty because we build from the PBF locally,
      # not download prebuilt tiles from some CDN.
      - tile_urls=
      # After the first successful build, ignore the PBF and reuse
      # the tiles under valhalla_tiles/ so restarts are instant.
      - use_tiles_ignore_pbf=True
      # Only rebuild tiles / elevation on explicit request — a
      # rebuild is a 10-30 min operation.
      - force_rebuild=False
      - force_rebuild_elevation=False
      # Elevation is pre-populated from Mapterhorn by setup_routing.sh
      # step 3 (see mapterhorn-elevation-source.md) — the container must
      # never fetch the AWS terrain tiles itself: that data is
      # void-filled SRTM, off by hundreds of metres in gorges, and a
      # container-side download would silently mix sources.
      - build_elevation=False
      - build_admins=True
      # Admin polygons are enough; time zones are not needed for
      # pedestrian routing (Valhalla only uses them for transit).
      - build_time_zones=False
      # Serving pool. VALHALLA_THREADS (env) sets it per machine — the
      # footpath-matrix builder saturates every thread here, so it should
      # follow the core count (setup_routing.sh exports nproc on Linux;
      # the 8 default fits the dev Mac). Bump MATRIX_WORKERS alongside
      # so both sides scale together. Going past ~16 needs the fd-limit
      # fix below (nofile.conf) or valhalla_service dies at startup.
      - server_threads=${VALHALLA_THREADS:-8}
      # After build, serve on :8002.
      - serve_tiles=True
    # Raises the container's hard/soft fd limits; nofile.conf (mounted
    # above) is what makes the soft limit survive the entrypoint's sudo.
    ulimits:
      nofile:
        soft: 65536
        hard: 1048576
    # Memory ceiling. Valhalla's per-request working set spikes far past
    # its steady state under the footpath-matrix build — a 24-thread run
    # was seen at 30 GB anon-RSS, which invoked the *host* OOM killer and
    # took Valhalla down mid-matrix while tippecanoe was running beside
    # it. The cap keeps that blast radius inside the container: docker
    # kills and restarts only Valhalla, and the matrix builder waits for
    # it to come back (see _wait_for_valhalla in
    # scripts/routing/build_valhalla_footpath_matrix.py) instead of losing the
    # run. memswap_limit matches mem_limit so the container cannot buy
    # extra headroom by thrashing the host's swap.
    #
    # 40g, not 32g: at 32 the cap itself became the binding constraint —
    # four cgroup kills in one matrix run, all at 33.4 GB anon-RSS, while
    # the host still had 30 GB free. The threads keep their largest-ever
    # matrix allocations, so usage plateaus around 30-35 GB once the run
    # reaches the dense agglomerations. 40g sits above that plateau and
    # still leaves ~20 GB for the tippecanoe emit running beside it.
    # Override per machine:
    # VALHALLA_MEM_LIMIT=12g docker compose up -d valhalla
    mem_limit: ${VALHALLA_MEM_LIMIT:-40g}
    memswap_limit: ${VALHALLA_MEM_LIMIT:-40g}
    restart: unless-stopped
    # Shared network with the MOTIS fork (query-time WALK routing —
    # MOTIS resolves this container as `kora-valhalla`). One-time:
    #   docker network create koramaps
    networks: [koramaps]

networks:
  koramaps:
    external: true
